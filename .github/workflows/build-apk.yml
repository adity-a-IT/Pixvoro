name: Build and Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Find and Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Pixvoro.apk
            echo "APK generated successfully at build-output/Pixvoro.apk"
          else
            echo "::error::No APK file found in build outputs!"
            exit 1
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixvoro-Android-APK
          path: build-output/Pixvoro.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          name: Pixvoro Android App (Latest APK)
          tag_name: latest-apk
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-output/Pixvoro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
